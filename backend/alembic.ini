[alembic]
script_location = alembic

# IMPORTANT: use sync driver here (psycopg2), not asyncpg
sqlalchemy.url = mysql+pymysql://root:root123@127.0.0.1:3306/smart_attendance

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/smart_attendance